<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">
        <div class="logo"><a href="#"><span>☀️</span> Skycast</a></div>
        <form>
            <input class="input" type="text" placeholder="Search for a city…">
            <button class="search-btn" type="search"> Search</button>

        </form>
        <nav class="nav">
            <a href="#" class="active">Today</a>
            <a href="#">Forecast</a>
        </nav>

    </header>

    <main>
        <section class="Cweather">
            <div class="Ctop">
                <div>
                    <p class="text-currnt">CURRENT WEATHER</p>

                    <p class="text-city">London, UK</p>
                    <small>Monday, 16 September</small>
                </div>
                <div class="Weather-img">
                    🌤️
                </div>
            </div>

            <div class="line"></div>


            <div class="Cbottom">
                <p><span class="degree">18</span><b>°C</b></p>
                <div class="Weather-descr">
                    <p class="text-descr">
                        Partly cloudy
                    </p>
                    <small>Feels like 17°C</small>
                </div>
            </div>

        </section>

        <section class="Weather-details">
            <div>
                <p class="text-day">T O D A Y</p>
                <p class="text-wd">Weather details</p>
            </div>
            <div class="cards">
                <div class="div">
                    <p>💧</p>
                    <small>Humidity</small>
                    <p>72%</p>
                </div>
                <div class="div">
                    <p>💨</p>
                    <small>Wind</small>
                    <p>14 km/h</p>
                </div>
                <div class="div">
                    <p>☀️</p>

                    <small>Visibility</small>
                    <p>10 km</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
